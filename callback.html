<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>CyberPulse Notice — Auth</title>
  <style>
    body { font-family: monospace; background: #0a0e1a; color: #00d4ff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 2rem; max-width: 600px; width: 90%; }
    h2 { color: #fff; margin-bottom: 1rem; }
    .code { background: #0a0e1a; padding: 1rem; border-radius: 8px; word-break: break-all; font-size: 0.85rem; border: 1px solid #00d4ff; }
    p { color: #94a3b8; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="box">
    <h2>✅ Autorização concluída</h2>
    <p>Copie o código abaixo e passe para o Claude Code:</p>
    <div class="code" id="code">Carregando...</div>
    <p id="msg"></p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');
    if (code) {
      document.getElementById('code').textContent = code;
      document.getElementById('msg').textContent = 'Cole esse código no terminal do Claude Code.';
    } else if (error) {
      document.getElementById('code').textContent = 'Erro: ' + error;
      document.getElementById('code').style.borderColor = '#ff3b3b';
    } else {
      document.getElementById('code').textContent = 'Nenhum código encontrado na URL.';
    }
  </script>
</body>
</html>
